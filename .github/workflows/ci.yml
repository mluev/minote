# Builds both apps and runs the unit tests on every pull request.
name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    name: Mac app and unit tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Select the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
      - run: swift build --product Minote
      - run: scripts/test.sh

  ios:
    name: iOS app
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Select the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
      - run: brew install xcodegen && xcodegen generate
      - run: >-
          xcodebuild build -quiet -project Minote.xcodeproj -scheme Minote-iOS
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
